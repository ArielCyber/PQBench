version: "3.8"

x-env-macos: &env_macos
  HEADLESS: "1"           # built-in web viewer
  QEMU_AUDIO_DRV: "none"
  VERSION: "14"
  RAM_SIZE: "6G"
  CPU_CORES: "2"
  DISK_SIZE: "64G"

x-macos-common: &macos_common
  image: dockurr/macos
  privileged: true
  devices:
    - /dev/kvm
    - /dev/net/tun
  cap_add:
    - NET_ADMIN
  restart: unless-stopped
  stop_grace_period: 2m

services:
  switcher:
    build: ./switcher
    image: switcher:latest
    container_name: switcher_container
    command: >
      gunicorn -w 2 -k gthread --threads 4 -t 0 -b 0.0.0.0:5000
      --access-logfile - --error-logfile -
      switcher:app
    ports: [ "5000:5000" ]
    environment:
      # Be careful of changing the container names - the URLs are dependent on them
      SNIFFER_URL: "http://172.18.0.1:8080"
      URL_LINUX_KYBER: "http://linux-kyber:5000"
      URL_LINUX_MLKEM: "http://linux-mlkem:5000"
      URL_WINDOWS_KYBER: "http://win-kyber:5000"
      URL_WINDOWS_MLKEM: "http://win-mlkem:5000"
      URL_MACOS_KYBER: "http://macos-kyber:5000"
      URL_MACOS_MLKEM: "http://macos-mlkem:5000"
      LOG_LEVEL: ${LOG_LEVEL}
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:5000/health" ]
      interval: 60s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [appnet]

  linux-kyber:
    shm_size: "1g"
    ulimits: { nofile: { soft: 65535, hard: 65535 } }
    build:
      context: ./sender_linux
      dockerfile: Dockerfile_Linux_Kyber
    container_name: linux-kyber
    restart: unless-stopped
    ports: [ "5001:5000" ]
    networks: [appnet]
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:5000/health || curl -fsS http://localhost:5000/ || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  linux-mlkem:
    shm_size: "1g"
    ulimits: { nofile: { soft: 65535, hard: 65535 } }
    build:
      context: ./sender_linux
      dockerfile: Dockerfile_Linux_MLKEM
    container_name: linux-mlkem
    restart: unless-stopped
    ports: [ "5002:5000" ]
    networks: [appnet]
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:5000/health || curl -fsS http://localhost:5000/ || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  agent-worker:
    build:
      context: agent
      dockerfile: Dockerfile_Agent
    container_name: agent_container
    environment:
      ENTRY_CONTROLLER_URL: "http://switcher:5000/config"
    restart: unless-stopped
    networks: [appnet]


  sniffer:
    build: { context: ./sniffer }
    container_name: sniffer_container
    command: uvicorn sniffer:app --host 0.0.0.0 --port 8080
    network_mode: "host"
    cap_add: [ "NET_ADMIN", "NET_RAW" ]
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./output:/output
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/health" ]
      interval: 60s
      timeout: 3s
      retries: 5

  # ------------------ WINDOWS VMs ------------------
  # Estimated first install + boot time - 20~ minutes
  # Estimated non first time startup - 1.5~ minutes
  # Windows VM that will run the windows processor
  win-kyber:
    image: dockurr/windows
    container_name: win-kyber
    environment:
      VERSION: "2025"
      EDITION: "core"
      RAM_SIZE: "6G"
      DISK_SIZE: "40G"
      CPU_CORES: "2"
      USERNAME: "Docker"
      PASSWORD: "admin"
      ARGUMENTS: "-cpu host,arch_capabilities=off"
    devices: [ "/dev/kvm", "/dev/net/tun" ]
    cap_add: [ "NET_ADMIN" ]
    ports:
      - "8006:8006"
      - "5003:5000"
    volumes:
      - ./sender_windows/oem/kyber:/oem
      - ./sender_windows/:/data
      - ./sender_windows/windows-kyber:/storage
    restart: unless-stopped
    stop_grace_period: 2m
    networks: [appnet]

  win-mlkem:
    image: dockurr/windows
    container_name: win-mlkem
    environment:
      VERSION: "2025"
      EDITION: "core"
      RAM_SIZE: "6G"
      DISK_SIZE: "40G"
      CPU_CORES: "2"
      ARGUMENTS: "-cpu host,arch_capabilities=off"
    devices: [ "/dev/kvm", "/dev/net/tun" ]
    cap_add: [ "NET_ADMIN" ]
    ports:
      - "8007:8006"
      - "5004:5000"
    volumes:
      - ./sender_windows/oem/mlkem:/oem
      - ./sender_windows/:/data
      - ./sender_windows/windows-mlkem:/storage
    restart: unless-stopped
    stop_grace_period: 2m
    networks: [appnet]

  # ------------------ macOS VMs ------------------
  macos-kyber:
    <<: *macos_common
    container_name: macos-kyber

    environment:
      <<: *env_macos         # your existing env anchor, if you have one
      MODE: "KYBER"
      RAM_SIZE: "4G"
      CPU_CORES: "2"
      DISK_SIZE: "40G"
      HEADLESS: "1"
      QEMU_AUDIO_DRV: "none"
      USER_PORTS: "5000"     # forward guest :5000 → container :5000

    volumes:
      - ./sender_mac/macos-kyber:/storage   # VM disks/NVRAM
      - ./sender_mac/shared:/shared         # shared folder into macOS

    ports:
      - "8008:8006"           # web viewer
      - "5901:5900/tcp"       # VNC (optional)
      - "5901:5900/udp"
      - "5005:5000"           # host 5005 → container 5000 → macOS 5000

    networks: [ appnet ]

    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:5000/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 15m



  macos-mlkem:
    <<: *macos_common
    container_name: macos-mlkem
    environment:
      <<: *env_macos
      MODE: "MLKEM"
      RAM_SIZE: "4G"
      CPU_CORES: "2"
      DISK_SIZE: "40G"
      HEADLESS: "1"
      QEMU_AUDIO_DRV: "none"
      USER_PORTS: "5000"     # forward guest :5000 → container :5000

    volumes:
      - ./sender_mac/macos-mlkem:/storage
      - ./sender_mac/shared:/shared

    ports:
      - "8009:8006"
      - "5902:5900/tcp"
      - "5902:5900/udp"
      - "5006:5000"

    networks: [appnet]
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:5000/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 15m

networks:
  appnet:
    name: shared-appnet
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: pqbench0
    ipam:
      config:
        - subnet: 172.18.0.0/24
          gateway: 172.18.0.1
