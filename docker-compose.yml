services:
  router:
    build: .
    image: router:latest
    ports: ["5000:5000"]
    environment:
      URL_LINUX_CHROME_KYBER: http://linux-kyber:5000
      URL_LINUX_CHROME_MLKEM: http://linux-mlkem:5000
    networks: [appnet]
    depends_on:
      linux-kyber: { condition: service_healthy }
      linux-mlkem: { condition: service_healthy }
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  linux-kyber:
    build:
      context: ./LinuxContainer
      dockerfile: Dockerfile_Linux_Kyber
    image: linux-ck:latest
    networks: [appnet]
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  linux-mlkem:
    build:
      context: ./LinuxContainer
      dockerfile: Dockerfile_Linux_MLKEM
    image: linux-cm:latest
    networks: [appnet]
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  appnet:
    name: shared-appnet
    driver: bridge
