services:
  switcher:
    build: ./switcher
    image: switcher:latest
    container_name: switcher_container
    command: >
      gunicorn -w 2 -k gthread --threads 4 -t 120 -b 0.0.0.0:5000
      --access-logfile - --error-logfile -
      switcher:app

    ports: [ "5000:5000" ]
    environment:
      SNIFFER_URL: "http://172.18.0.1:8080"
      URL_LINUX_KYBER: "http://linux-kyber:5000"
      URL_LINUX_MLKEM: "http://linux-mlkem:5000"
      URL_WIN_KYBER: "http://win-kyber:5000"
      URL_WIN_MLKEM: "http://win-mlkem:5000"
      # add the rest when they are ready
      # ... your existing URLs ...
      SNIFFER_IFACE: "pqbench0"                # optional, matches your sniffer env
      SNIFFER_FILTER_MODE: "domain"            # or "none"/"custom"
      SNIFFER_DOMAIN: "pq.cloudflareresearch.com"
      SNIFFER_DURATION_SEC: "30"

    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:5000/health" ]
      interval: 60s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [appnet]

  linux-kyber:
    build:
      context: ./sender_linux
      dockerfile: Dockerfile_Linux_Kyber
    container_name: linux-kyber
    restart: unless-stopped
    ports:
      - "5001:5000"
    networks: [appnet]
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:5000/health || curl -fsS http://localhost:5000/ || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  linux-mlkem:
    build:
      context: ./sender_linux
      dockerfile: Dockerfile_Linux_MLKEM
    container_name: linux-mlkem
    restart: unless-stopped
    ports:
      - "5002:5000"
    networks: [appnet]
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:5000/health || curl -fsS http://localhost:5000/ || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  agent-worker:
    build:
      context: agent
      dockerfile: Dockerfile_Agent    # <- this is the agent Dockerfile above
    image: agent:latest
    container_name: agent_container
    environment:
      ENTRY_CONTROLLER_URL: "http://switcher:5000/config"
      INTERVAL_SEC: "60"        # change cadence if you want
    restart: unless-stopped
    networks: [appnet]

  sniffer:
    build:
      context: ./sniffer
    container_name: sniffer_container
    command: uvicorn sniffer:app --host 0.0.0.0 --port 8080
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    environment:
      OUTPUT_ROOT: /output
      LOG_LEVEL: DEBUG
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # to inspect/exec into other containers
      - ./output:/output
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:5000/health" ]
      interval: 60s
      timeout: 3s
      retries: 5

  # Estimated first install + boot time - 20~ minutes
  # Estimated non first time startup - 1.5~ minutes
  # Windows VM that will run the windows processor
  win-kyber:
    image: dockurr/windows
    container_name: win-kyber
    environment:
      VERSION: "2025"
      EDITION: "core"
      RAM_SIZE: "6G"
      DISK_SIZE: "40G"
      CPU_CORES: "2"
      USERNAME: "Docker"      # default user (can change)
      PASSWORD: "admin"       # default pass (can change)
      # Optional: give Windows its own L2 IP later (see macvlan note)
      # DHCP: "Y"
      ARGUMENTS: "-cpu host,arch_capabilities=off" # MUST for Windows 11 to work : https://github.com/dockur/windows/issues/1301#issuecomment-3062008123
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"           # web viewer (install phase / emergency)
      - "5003:5000"           # Flask inside Windows -> exposed as 5001 on host/network
    volumes:
      - ./sender_windows/oem/kyber:/oem      # auto-run installer at first boot
      - ./sender_windows/:/data              # shows up inside Windows as \\host.lan\Data
      - ./sender_windows/windows-kyber:/storage
    restart: unless-stopped
    stop_grace_period: 2m
    networks: [appnet]

  # Windows VM that will run the windows processor
  win-mlkem:
    image: dockurr/windows
    container_name: win-mlkem
    environment:
      VERSION: "2025"
      RAM_SIZE: "6G"
      EDITION: "core"
      DISK_SIZE: "40G"
      CPU_CORES: "2"
      ARGUMENTS: "-cpu host,arch_capabilities=off" # MUST for Windows 11 to boot consistently: https://github.com/dockur/windows/issues/1301#issuecomment-3062008123
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "8007:8006"
      - "5004:5000"
    volumes:
      - ./sender_windows/oem/mlkem:/oem
      - ./sender_windows/:/data
      - ./sender_windows/windows-mlkem:/storage
    restart: unless-stopped
    stop_grace_period: 2m
    networks: [appnet]

networks:
  appnet:
    name: shared-appnet
    driver: bridge
    # Gives the bridge a stable, known name so the sniffer can target it.
    driver_opts:
      com.docker.network.bridge.name: pqbench0
    ipam:
      config:
        - subnet: 172.18.0.0/24 # The first 24 bits are for the network, the last 8 are for the host
          gateway: 172.18.0.1