version: "3.8"

x-env-macos: &env_macos
  HEADLESS: "1"           # use the built-in web viewer (no GTK)
  QEMU_AUDIO_DRV: "none"  # don't try ALSA
  VERSION: "14"
  # Resources (defaults are 2 cores / 4G if you omit these)
  RAM_SIZE: "6G"
  CPU_CORES: "2"
  DISK_SIZE: "64G"

x-macos-common: &macos_common
  image: dockurr/macos
  privileged: true
  devices:
    - /dev/kvm
    - /dev/net/tun
  cap_add:
    - NET_ADMIN
  # Headless + silence audio backend to avoid ALSA issues on non-Linux hosts
  restart: unless-stopped
  stop_grace_period: 2m

services:
  macos-kyber:
    <<: *macos_common
    container_name: macos-kyber
    environment:
      <<: *env_macos
      MODE: "KYBER"       # <-- your app logic can key off this
    # Persist VM state separately for this VM
    volumes:
      - ./macos-kyber:/storage   # persistent VM files (disks, NVRAM, etc.)
      - ./shared:/shared         # <--- PQBench scripts
    ports:
      - "8008:8006"              # web viewer (http://localhost:8008)
      - "5901:5900/tcp"          # VNC (optional)
      - "5901:5900/udp"
      - "5005:5000"
    networks: [pqbench-macos]

  macos-mlkem:
    <<: *macos_common
    container_name: macos-mlkem
    environment:
      <<: *env_macos
      MODE: "MLKEM"
    volumes:
      - ./macos-mlkem:/storage
      - ./shared:/shared
    ports:
      - "8009:8006"
      - "5902:5900/tcp"
      - "5902:5900/udp"
      - "5006:5000"
    networks: [pqbench-macos]

networks:
  pqbench-macos:
    driver: bridge
